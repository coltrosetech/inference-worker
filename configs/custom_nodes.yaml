# ComfyUI custom nodes required by the three shipped presets. Each entry:
#   name: label (also the install dir under custom_nodes/)
#   repo: git URL (https)
#   ref: git ref (commit sha, tag, or branch). Pin to sha for reproducibility.
#   post_install: optional shell command run inside the node directory
#
# Install with: bash scripts/install_custom_nodes.sh
# Everything else used by the workflows (GrowMask, ImageCompositeMasked, UNETLoader,
# WanImageToVideo, WanFirstLastFrameToVideo, KSamplerAdvanced, ModelSamplingSD3, ...)
# ships in ComfyUI core. Leffa (Faz 3 try-on upgrade) will add its own node here.
nodes:
  # tryon: IPAdapterUnifiedLoader + IPAdapterAdvanced
  - name: ComfyUI_IPAdapter_plus
    repo: https://github.com/cubiq/ComfyUI_IPAdapter_plus.git
    ref: main
    post_install: "test -f requirements.txt && python -m pip install -r requirements.txt || true"

  # wan_i2v + wan_flf2v: VHS_VideoCombine (mp4 muxing)
  - name: ComfyUI-VideoHelperSuite
    repo: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    ref: main
    post_install: "test -f requirements.txt && python -m pip install -r requirements.txt || true"
