# Phase 1 + Phase 2 custom nodes. Each entry:
#   name: label
#   repo: git URL (https)
#   ref: git ref (commit sha, tag, or branch). Pin to sha for reproducibility.
#   post_install: optional shell command run inside the node directory
nodes:
  - name: IPAdapter_plus
    repo: https://github.com/cubiq/ComfyUI_IPAdapter_plus.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  - name: tooling-nodes
    repo: https://github.com/Acly/comfyui-tooling-nodes.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  - name: KJNodes
    repo: https://github.com/kijai/ComfyUI-KJNodes.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  # ===== Phase 2: controlnet =====
  - name: Advanced-ControlNet
    repo: https://github.com/Kosinkadink/ComfyUI-Advanced-ControlNet.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  - name: controlnet_aux
    repo: https://github.com/Fannovel16/comfyui_controlnet_aux.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  # ===== Phase 2: ltx_video =====
  - name: LTXVideo
    repo: https://github.com/Lightricks/ComfyUI-LTXVideo.git
    ref: master
    post_install: "python -m pip install -r requirements.txt || true"

  - name: VideoHelperSuite
    repo: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    ref: main
    post_install: "python -m pip install -r requirements.txt || true"

  # ===== Auto clothing segmentation for inpaint =====
  # Loads mattmdjaga/segformer_b2_clothes at module import time from
  # $MODELS_PATH/segformer_b2_clothes/, so the model MUST be present before
  # ComfyUI is restarted (see configs/models.yaml).
  # The upstream __init__.py also imports segformer_b3_fashion (unused by us
  # and not downloaded); we strip that reference so the package imports cleanly.
  - name: SegformerB2_Clothes
    repo: https://github.com/StartHua/Comfyui_segformer_b2_clothes.git
    ref: main
    post_install: "python -m pip install 'transformers>=4.38' || true && sed -i '/segformer_b3_fashion/d' __init__.py"
