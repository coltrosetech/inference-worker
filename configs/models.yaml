    dest: controlnet/flux_controlnet_union_pro_2_fp8.safetensors
    sha256: ""
    size_mb: 2140

  - name: FLUX VAE (ae)
    repo: ffxvs/vae-flux
    filename: ae.safetensors
    dest: vae/flux_ae.safetensors
    sha256: ""
    size_mb: 335

  - name: CLIP-L (FLUX text encoder)
    repo: comfyanonymous/flux_text_encoders
    filename: clip_l.safetensors
    dest: text_encoders/clip_l.safetensors
