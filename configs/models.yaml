# Phase 1 + Phase 2 model manifest. Each entry:
#   name: human label (also used in logs)
#   repo: HuggingFace repo id
#   filename: file to download within the repo
#   dest: path under $MODELS_PATH where the file lands (keeps ComfyUI's expected layout)
#   sha256: SHA-256 of the downloaded file (verified; empty string skips)
#   size_mb: expected size in MB (used for sanity checks + progress)
#
# Paths mirror ComfyUI's models/ subfolders so symlinks just work.

models:
  - name: JuggernautXL Lightning 4-step
    repo: RunDiffusion/Juggernaut-XL-Lightning
    filename: Juggernaut_RunDiffusionPhoto2_Lightning_4Steps.safetensors
    dest: checkpoints/Juggernaut_RunDiffusionPhoto2_Lightning_4Steps.safetensors
    sha256: ""
    size_mb: 6617

  - name: SDXL VAE fp16 fix
    repo: madebyollin/sdxl-vae-fp16-fix
    filename: sdxl_vae.safetensors
    dest: vae/sdxl_vae_fp16_fix.safetensors
    sha256: ""
    size_mb: 320

  - name: SDXL LCM LoRA
    repo: latent-consistency/lcm-lora-sdxl
    filename: pytorch_lora_weights.safetensors
    dest: loras/lcm_lora_sdxl.safetensors
    sha256: ""
    size_mb: 394

  - name: IP-Adapter Plus SDXL
    repo: h94/IP-Adapter
    filename: sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
    dest: ipadapter/ip-adapter-plus_sdxl_vit-h.safetensors
    sha256: ""
    size_mb: 851

  - name: CLIP-ViT-H-14 (IP-Adapter encoder)
    repo: h94/IP-Adapter
    filename: models/image_encoder/model.safetensors
    dest: clip_vision/CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
    sha256: ""
    size_mb: 1264

  # ===== Phase 2: controlnet =====
  - name: ControlNet Union SDXL ProMax
    repo: xinsir/controlnet-union-sdxl-1.0
    filename: diffusion_pytorch_model_promax.safetensors
    dest: controlnet/cn_union_sdxl_promax.safetensors
    sha256: ""
    size_mb: 2506

  # ===== Phase 2: ltx_video =====
  - name: LTX-Video 2B 0.9.8 distilled fp8
    repo: Lightricks/LTX-Video
    filename: ltxv-2b-0.9.8-distilled-fp8.safetensors
    dest: checkpoints/ltxv_2b_0_9_8_distilled_fp8.safetensors
    sha256: ""
    size_mb: 4500

  - name: T5-XXL fp8 encoder
    repo: comfyanonymous/flux_text_encoders
    filename: t5xxl_fp8_e4m3fn.safetensors
    dest: text_encoders/t5xxl_fp8_e4m3fn.safetensors
    sha256: ""
    size_mb: 4890

  # ===== Phase 2: edit_premium (FLUX.1-Kontext) =====
  - name: FLUX.1-Kontext-dev fp8 scaled
    repo: Comfy-Org/flux1-kontext-dev_ComfyUI
    filename: split_files/diffusion_models/flux1-dev-kontext_fp8_scaled.safetensors
    dest: diffusion_models/flux_kontext_dev_fp8_scaled.safetensors
    sha256: ""
    size_mb: 11900

  # ===== inpaint_premium (FLUX.1-Fill-dev) =====
  - name: FLUX.1-Fill-dev fp8
    repo: dim/black-forest-labs_FLUX.1-Fill-dev_flux1-fill-dev_fp8.safetensors
    filename: black-forest-labs_FLUX.1-Fill-dev_flux1-fill-dev_fp8.safetensors
    dest: diffusion_models/flux_fill_dev_fp8.safetensors
    sha256: ""
    size_mb: 11900

  # ===== inpaint_sdxl (JuggernautXL Inpaint) =====
  - name: JuggernautXL Inpaint
    repo: modelzpalace/juggernautInpaint
    filename: juggernautXL_versionXInpaint.safetensors
    dest: checkpoints/juggernaut_xl_inpaint.safetensors
    sha256: ""
    size_mb: 6937

  # ===== inpaint_realvis (RealVisXL V4 Inpaint) =====
  - name: RealVisXL V4.0 Inpaint
    repo: henrysasse193/realvisxlInpainting_v40-inpainting
    filename: realvisxlInpainting_v40-inpainting.safetensors
    dest: checkpoints/realvisxl_v40_inpaint.safetensors
    sha256: ""
    size_mb: 6937

  # ===== ControlNet Pose guard for inpaint_premium =====
  - name: FLUX.1-dev ControlNet Union Pro 2.0 fp8
    repo: ABDALLALSWAITI/FLUX.1-dev-ControlNet-Union-Pro-2.0-fp8
