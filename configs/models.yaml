# Model manifest for the three shipped presets (tryon · wan_i2v · wan_flf2v).
# Each entry:
#   name: human label (also used in logs)
#   repo: HuggingFace repo id
#   filename: file to download within the repo
#   dest: path under $MODELS_PATH where the file lands (mirrors ComfyUI's layout)
#   sha256: SHA-256 of the file (verified; empty string skips)
#   size_mb: expected size in MB (sanity check + progress)
#
# Provision a fresh box with: python scripts/download_models.py
# NOTE: Leffa (Faz 3 try-on) is NOT listed here — its ComfyUI node pulls its own
# weights into $MODELS_PATH/Leffa via snapshot_download.

models:
  # ===== tryon (JuggernautXL Inpaint + IP-Adapter Plus + auto-mask + hires) =====
  - name: JuggernautXL Inpaint
    repo: modelzpalace/juggernautInpaint
    filename: juggernautXL_versionXInpaint.safetensors
    dest: checkpoints/juggernaut_xl_inpaint.safetensors
    sha256: ""
    size_mb: 6937

  - name: IP-Adapter Plus SDXL
    repo: h94/IP-Adapter
    filename: sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
    dest: ipadapter/ip-adapter-plus_sdxl_vit-h.safetensors
    sha256: ""
    size_mb: 851

  - name: CLIP-ViT-H-14 (IP-Adapter encoder)
    repo: h94/IP-Adapter
    filename: models/image_encoder/model.safetensors
    dest: clip_vision/CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
    sha256: ""
    size_mb: 2528

  - name: SegFormer-B2 Clothes weights
    repo: mattmdjaga/segformer_b2_clothes
    filename: model.safetensors
    dest: segformer_b2_clothes/model.safetensors
    sha256: ""
    size_mb: 109

  - name: SegFormer-B2 Clothes config
    repo: mattmdjaga/segformer_b2_clothes
    filename: config.json
    dest: segformer_b2_clothes/config.json
    sha256: ""
    size_mb: 1

  - name: SegFormer-B2 Clothes preprocessor
    repo: mattmdjaga/segformer_b2_clothes
    filename: preprocessor_config.json
    dest: segformer_b2_clothes/preprocessor_config.json
    sha256: ""
    size_mb: 1

  - name: 4x-UltraSharp ESRGAN (tryon hires-fix)
    repo: lokCX/4x-Ultrasharp
    filename: 4x-UltraSharp.pth
    dest: upscale_models/4x-UltraSharp.pth
    sha256: ""
    size_mb: 64

  # ===== shared Wan text encoder + VAE + clip vision (wan_i2v & wan_flf2v) =====
  - name: Wan umt5-xxl fp8 text encoder
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    filename: split_files/text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    dest: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
    sha256: ""
    size_mb: 6736

  - name: Wan 2.1 VAE
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    filename: split_files/vae/wan_2.1_vae.safetensors
    dest: vae/wan_2.1_vae.safetensors
    sha256: ""
    size_mb: 254

  - name: Wan CLIP vision H (wan_flf2v)
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    filename: split_files/clip_vision/clip_vision_h.safetensors
    dest: clip_vision/clip_vision_h.safetensors
    sha256: ""
    size_mb: 1264

  # ===== wan_i2v (Wan 2.2 I2V 14B MoE + LightX2V 4-step) =====
  - name: Wan 2.2 I2V 14B high-noise fp8
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    filename: split_files/diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    dest: diffusion_models/wan2.2_i2v_high_noise_14B_fp8_scaled.safetensors
    sha256: ""
    size_mb: 14295

  - name: Wan 2.2 I2V 14B low-noise fp8
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    filename: split_files/diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    dest: diffusion_models/wan2.2_i2v_low_noise_14B_fp8_scaled.safetensors
    sha256: ""
    size_mb: 14295

  - name: Wan 2.2 I2V LightX2V 4-step LoRA (high-noise)
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    filename: split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    dest: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_high_noise.safetensors
    sha256: ""
    size_mb: 1227

  - name: Wan 2.2 I2V LightX2V 4-step LoRA (low-noise)
    repo: Comfy-Org/Wan_2.2_ComfyUI_Repackaged
    filename: split_files/loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    dest: loras/wan2.2_i2v_lightx2v_4steps_lora_v1_low_noise.safetensors
    sha256: ""
    size_mb: 1227

  # ===== wan_flf2v (Wan 2.1 FLF2V 14B + LightX2V distill) =====
  - name: Wan 2.1 FLF2V 720p 14B fp8
    repo: Comfy-Org/Wan_2.1_ComfyUI_repackaged
    filename: split_files/diffusion_models/wan2.1_flf2v_720p_14B_fp8_e4m3fn.safetensors
    dest: diffusion_models/wan2.1_flf2v_720p_14B_fp8_e4m3fn.safetensors
    sha256: ""
    size_mb: 16398

  - name: LightX2V I2V 14B 480p distill LoRA rank64 (wan_flf2v)
    repo: Kijai/WanVideo_comfy
    filename: Lightx2v/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
    dest: loras/lightx2v_I2V_14B_480p_cfg_step_distill_rank64_bf16.safetensors
    sha256: ""
    size_mb: 738
